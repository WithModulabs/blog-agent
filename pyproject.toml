[project]
name = "backand"
version = "0.1.0"
description = "Backand powered by Act Operator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.3.1",
    "langchain-google-genai>=4.1.3",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.0",
    "markdown>=3.10",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.34.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
